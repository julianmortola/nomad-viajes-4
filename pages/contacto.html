<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body class="pagina">
    <header class="encabezado">
        <p class="marca">Nomad</p>
        <nav class="navegacion">
            <ul class="menu">
                <li><a class="enlace-menu" href="../index.html">Inicio</a></li>
                <li><a class="enlace-menu" href="servicios.html">Servicios</a></li>
                <li><a class="enlace-menu" href="planes.html">Planes</a></li>
                <li><a class="enlace-menu" href="faq.html">Preguntas frecuentes</a></li>
                <li><a class="enlace-menu" href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido">
        <section class="seccion">
            <h1 class="titulo-principal">Contacto</h1>
            <p class="texto">Contanos qué viaje querés hacer y cuáles son tus principales preferencias.</p>
        </section>
        <section class="seccion">
            <h2 class="titulo-seccion">Formulario de consulta</h2>
            <form class="formulario" action="#" method="post">
                <label class="etiqueta" for="nombre">Nombre</label>
                <input class="campo" type="text" id="nombre" name="nombre" required>
                <label class="etiqueta" for="email">Correo electrónico</label>
                <input class="campo" type="email" id="email" name="email" required>
                <label class="etiqueta" for="destino">Destino</label>
                <input class="campo" type="text" id="destino" name="destino">
                <label class="etiqueta" for="mensaje">Mensaje</label>
                <textarea class="campo" id="mensaje" name="mensaje"></textarea>
                <input class="boton" type="submit" value="Enviar consulta">
            </form>
        </section>

    </main>
    <footer class="pie">
        <p class="texto-pie">&copy; 2026 Nomad. Todos los derechos reservados.</p>
        <p><a class="enlace-pie" href="https://www.instagram.com/" target="_blank">Instagram</a></p>
    </footer>

</body>
</html>
